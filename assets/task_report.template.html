<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #FAF9F5;
    --bg-panel: #F4F0E8;
    --ink: #1F1B16;
    --ink-soft: #5B564C;
    --accent: #C2694A;
    --accent-soft: #E7DCCF;
    --rule: #E4DFD3;
    --code-bg: #F1ECE1;
    --max-w: 720px;
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 17px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .page{
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 6rem 1.5rem 8rem;
  }

  .doc-header{
    margin-bottom: 4rem;
    padding-bottom: 2.5rem;
    border-bottom: 1px solid var(--rule);
  }

  .doc-eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 1rem;
  }

  .doc-header h1{
    margin: 0 0 0.75rem;
  }

  .doc-meta{
    font-size: 0.9rem;
    color: var(--ink-soft);
    margin: 0;
  }

  h1, h2, h3, h4, h5, h6{
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.25;
    letter-spacing: -0.01em;
  }

  h1{ font-size: 2.6rem; font-weight: 600; }
  h2{
    font-size: 1.7rem;
    margin-top: 3.5rem;
    margin-bottom: 1.1rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
  }
  h3{ font-size: 1.3rem; margin-top: 2.5rem; margin-bottom: 0.8rem; }
  h4{ font-size: 1.05rem; margin-top: 2rem; margin-bottom: 0.6rem; color: var(--ink-soft); }

  h2:first-child, h3:first-child{ margin-top: 0; padding-top: 0; border-top: none; }

  p{ margin: 0 0 1.3rem; }

  a{
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--accent-soft);
    transition: border-color 0.15s ease;
  }
  a:hover{ border-bottom-color: var(--accent); }

  strong{ font-weight: 600; }
  em{ font-style: italic; color: var(--ink-soft); }

  ul, ol{
    margin: 0 0 1.3rem;
    padding-left: 1.4rem;
  }
  li{ margin-bottom: 0.5rem; }
  li::marker{ color: var(--accent); }

  blockquote{
    margin: 2rem 0;
    padding: 0.2rem 0 0.2rem 1.4rem;
    border-left: 3px solid var(--accent);
    color: var(--ink-soft);
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-size: 1.08rem;
  }
  blockquote p:last-child{ margin-bottom: 0; }

  code{
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85em;
    background: var(--code-bg);
    padding: 0.15em 0.4em;
    border-radius: 4px;
    color: #8A4A2E;
  }

  pre{
    background: var(--ink);
    color: #F4F0E8;
    padding: 1.4rem 1.6rem;
    border-radius: 10px;
    overflow-x: auto;
    margin: 1.8rem 0;
    line-height: 1.6;
  }
  pre code{
    background: none;
    color: inherit;
    padding: 0;
    font-size: 0.85rem;
  }

  .codehilite{
    background: var(--ink);
    border-radius: 10px;
    margin: 1.8rem 0;
    overflow-x: auto;
  }
  .codehilite pre{ margin: 0; background: none; border-radius: 0; }

  table{
    width: 100%;
    border-collapse: collapse;
    margin: 2rem 0;
    font-size: 0.92rem;
  }
  th, td{
    text-align: left;
    padding: 0.7rem 1rem;
    border-bottom: 1px solid var(--rule);
  }
  th{
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 500;
  }
  tbody tr:hover{ background: var(--bg-panel); }

  hr{
    border: none;
    border-top: 1px solid var(--rule);
    margin: 3rem 0;
  }

  img{
    max-width: 100%;
    border-radius: 8px;
    margin: 1.5rem 0;
    display: block;
  }

  figcaption{
    font-size: 0.85rem;
    color: var(--ink-soft);
    text-align: center;
    margin-top: 0.5rem;
  }

  .doc-footer{
    margin-top: 5rem;
    padding-top: 2rem;
    border-top: 1px solid var(--rule);
    font-size: 0.85rem;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .inescop {
    border: 1.5px solid #a87d0a;
    background-color: #a87d0a40;
    font-size: 0.8rem;
    padding-left: 5px;
    padding-right: 5px;
    border-radius: 5px;
  }

  .red21 {
    border: 1.5px solid #0098d9;
    background-color: #0098d940;
    font-size: 0.8rem;
    padding-left: 5px;
    padding-right: 5px;
    border-radius: 5px;
  }

  .newlast {
    border: 1.5px solid #a2368d;
    background-color: #a2368d40;
    font-size: 0.8rem;
    padding-left: 5px;
    padding-right: 5px;
    border-radius: 5px;
  }

  .other {
    border: 1.5px solid #a4a4a4;
    background-color: #a4a4a440;
    font-size: 0.8rem;
    padding-left: 5px;
    padding-right: 5px;
    border-radius: 5px;
  }

  @media (max-width: 640px){
    .page{ padding: 3.5rem 1.25rem 5rem; }
    h1{ font-size: 2rem; }
    h2{ font-size: 1.4rem; }
  }
</style>
</head>
<body>

  <main class="page">

    <header class="doc-header">
      <p class="doc-eyebrow">{{eyebrow}}</p>
      <h1>{{title}}</h1>
      <p class="doc-meta">{{subtitle}}</p>
    </header>

    <article class="doc-content">
      {{content}}
    </article>

    <footer class="doc-footer">
      <span>{{footer_left}}</span>
      <span>{{footer_right}}</span>
    </footer>

  </main>

</body>
</html>
